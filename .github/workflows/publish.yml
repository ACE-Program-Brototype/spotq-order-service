name: Order Service Image Publishing

on:
  workflow_run:
    workflows: ["Order Service CI"]
    types: [completed]
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: order-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish Docker Image
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository    
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Order Service
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  

      - name: Set Image Details
        id: image
        run: |
          echo "repository=${{ secrets.DOCKERHUB_USERNAME }}/spotq-order-service" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Infrastructure Repository Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: ACE-Program-Brototype
          repositories: spotq-infra

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v7
        with:
          repository: ACE-Program-Brototype/spotq-infra
          ref: development
          token: ${{ steps.app-token.outputs.token }}
          path: spotq-infra
          persist-credentials: false

      - name: Update Order Service Image Digest
        working-directory: spotq-infra
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          MANIFEST="deploy/images.lock.env"
          KEY="SPOTQ_ORDER_SERVICE_IMAGE"
          IMAGE="docker.io/${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          COUNT=$(grep -c "^${KEY}=" "$MANIFEST" || true)

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one $KEY entry, found $COUNT"
            exit 1
          fi

          sed -i "s|^${KEY}=.*|${KEY}=${IMAGE}|" "$MANIFEST"

          echo "Updated $KEY to $IMAGE"

      - name: Create Infrastructure Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: spotq-infra
          branch: automation/order-service-image-update
          delete-branch: true
          add-paths: deploy/images.lock.env
          commit-message: "chore(deploy): update order service image"
          title: "Deploy: Update Order Service Image"
          body: |
            ## Order Service Image Update

            A new Order Service Docker image has been published.

            - **Commit:** `${{ github.event.workflow_run.head_sha }}`            
            - **Image:** `${{ steps.image.outputs.repository }}`
            - **Digest:** `${{ steps.build.outputs.digest }}`

            This PR updates the Order Service image digest
            in `deploy/images.lock.env`.

            Merge this PR to trigger the infrastructure deployment workflow.
