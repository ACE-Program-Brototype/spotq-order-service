name: Order Service CD

on:
  workflow_run:
    workflows:
      - Order Service CI
    types:
      - completed

jobs:
  docker-publish:
    name: Build & Push Docker Image
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # Checkout the exact commit verified by CI
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spotq-order-service:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/spotq-order-service:latest

      # Report Status
      - name: Report Deployment Status
        run: |
          echo "=============================================="
          echo "      SpotQ Order Service CD"
          echo "=============================================="
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/spotq-order-service:${{ github.event.workflow_run.head_sha }}"
          echo "Status: Docker image pushed successfully"
          echo "=============================================="
