name: Order Service CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

concurrency:
  group: order-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify

    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Install Dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Generate Prisma Client
      - name: Generate Prisma Client
        run: pnpm prisma generate

      # Lint
      - name: Run Biome
        run: pnpm lint

      # Typecheck
      - name: Typecheck
        run: pnpm typecheck

      # Run Tests
      - name: Run Tests
        run: pnpm test

      # Build Application
      - name: Build Application
        run: pnpm build

      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t spotq-order-service:ci .
